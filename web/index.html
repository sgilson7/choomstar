<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Reference default: everything from this origin. 'wasm-unsafe-eval'
       lets the page compile its own WebAssembly module; form-action 'none'
       blocks form posts. Choomstar is single player and names no other
       origin. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Choomstar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-ready="false" data-screen="loading">
  <canvas id="view"></canvas>
  <div id="crosshair" aria-hidden="true"></div>
  <div id="hud" aria-live="polite"></div>
  <div id="overlay" hidden></div>
  <div id="loading" role="status"><span id="loading-text"></span></div>
  <p id="message" role="alert"></p>
  <noscript><p>This page needs JavaScript and WebAssembly.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
